plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

group = 'com.github.iammert'
version = '1.0.0'

android {
    namespace = 'com.iammert.library.ui.multisearchviewlib'
    compileSdk = 36

    defaultConfig {
        minSdk = 21

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // Compile interface default methods as Java default methods.
        jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.NO_COMPATIBILITY
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    testImplementation libs.junit
    testImplementation libs.androidx.test.core.ktx
    testImplementation libs.androidx.test.ext.junit.ktx
    testImplementation libs.robolectric
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'MultiSearchView'

                pom {
                    name = 'MultiSearchView'
                    description = 'Animated search view with multiple search queries for Android'
                    url = 'https://github.com/iammert/MultiSearchView'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }
    }
}
